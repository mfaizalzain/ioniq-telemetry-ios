name: IoniqTelemetry
# Debug-CarPlay exists only so the CarPlay entitlement can be applied without
# making it the default. Passing CODE_SIGN_ENTITLEMENTS on the xcodebuild command
# line does not work here — it leaks into every SPM package target, and the app
# target's own setting still wins, so the app builds with empty entitlements and
# the CarPlay scene never attaches.
configs:
  Debug: debug
  Debug-CarPlay: debug
  Release: release
options:
  bundleIdPrefix: com.fmz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: S232V5F699
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
    ITSAppUsesNonExemptEncryption: false
    # iPhone only. The layouts have never been designed or tested for iPad, and
    # shipping a stretched one invites a 2.4.1 rejection. Set here rather than in
    # the project file, which xcodegen regenerates.
    TARGETED_DEVICE_FAMILY: 1
targets:
  IoniqTelemetry:
    type: application
    platform: iOS
    sources:
      - IoniqTelemetry
    configFiles:
      Debug: Secrets.xcconfig
      Debug-CarPlay: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: IoniqTelemetry/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: IoniqTelemetry/Resources/IoniqTelemetry.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.fmz.IoniqTelemetry
        DEFINES_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @loader_path/Frameworks"
      configs:
        Debug-CarPlay:
          CODE_SIGN_ENTITLEMENTS: IoniqTelemetry/Resources/IoniqTelemetry-CarPlay.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: IoniqTelemetry/Resources/IoniqTelemetry-CarPlay.entitlements
    dependencies:
      - package: CoreOBD
      - package: CoreDomain
      - package: CoreData
      - package: CoreRouting
      - package: CoreUI
      - sdk: CoreBluetooth.framework
      - sdk: CarPlay.framework
      - sdk: MapKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: StoreKit.framework
      - sdk: BackgroundTasks.framework
      - sdk: Charts.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
  IoniqTelemetryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IoniqTelemetryTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.fmz.IoniqTelemetryTests
    dependencies:
      - target: IoniqTelemetry
packages:
  CoreOBD:
    path: Packages/CoreOBD
  CoreDomain:
    path: Packages/CoreDomain
  CoreData:
    path: Packages/CoreData
  CoreRouting:
    path: Packages/CoreRouting
  CoreUI:
    path: Packages/CoreUI
schemes:
  IoniqTelemetry:
    build:
      targets:
        IoniqTelemetry: all
        IoniqTelemetryTests: [test]
    run:
      config: Debug
      # Local StoreKit testing: purchases resolve against this file, so the paywall
      # is exercisable before the products exist in App Store Connect.
      storeKitConfiguration: IoniqTelemetry/Resources/IoniqTelemetry.storekit
    test:
      config: Debug
      targets:
        - IoniqTelemetryTests
    archive:
      config: Release
