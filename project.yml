name: IoniqTelemetry
options:
  bundleIdPrefix: com.fmz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: S232V5F699
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IoniqTelemetry:
    type: application
    platform: iOS
    sources:
      - IoniqTelemetry
    settings:
      base:
        INFOPLIST_FILE: IoniqTelemetry/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fmz.IoniqTelemetry
        DEFINES_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @loader_path/Frameworks"
    dependencies:
      - package: CoreOBD
      - package: CoreDomain
      - package: CoreData
      - package: CoreRouting
      - package: CoreUI
      - sdk: CoreBluetooth.framework
      - sdk: CarPlay.framework
      - sdk: MapKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: StoreKit.framework
      - sdk: BackgroundTasks.framework
      - sdk: Charts.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
  IoniqTelemetryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IoniqTelemetryTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fmz.IoniqTelemetryTests
    dependencies:
      - target: IoniqTelemetry
packages:
  CoreOBD:
    path: Packages/CoreOBD
  CoreDomain:
    path: Packages/CoreDomain
  CoreData:
    path: Packages/CoreData
  CoreRouting:
    path: Packages/CoreRouting
  CoreUI:
    path: Packages/CoreUI
