name: iOS Release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version (CFBundleShortVersionString), e.g. 1.0.2. Must exist as a version in App Store Connect.'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Build number (CFBundleVersion). Empty = auto (timestamp-based, always higher than the last upload).'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, Export & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        # Apple requires the iOS 26 SDK (Xcode 26+) for uploads; the macos-15
        # image defaults to an older Xcode, so pin the newest 26.x explicitly.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          test -n "$XCODE_APP" || { echo "ERROR: no Xcode 26 found"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare workspace (Secrets.xcconfig)
        # Secrets.xcconfig is gitignored; XcodeGen validates its existence at
        # generate time, so it must exist BEFORE xcodegen runs.
        run: |
          cp Secrets.xcconfig.example Secrets.xcconfig
          if [ -n "${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" ]; then
            echo "OPEN_CHARGE_MAP_API_KEY=${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" >> Secrets.xcconfig
          fi
          cat Secrets.xcconfig
          mkdir -p IoniqTelemetryTests

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/profile.mobileprovision"
          # Derive the profile NAME from the file; exportOptions.plist and
          # PROVISIONING_PROFILE_SPECIFIER both need it.
          PROFILE_NAME="$(security cms -D -i "$PROFILE_DIR/profile.mobileprovision" | plutil -extract Name raw -)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Resolve version & build number
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            # Auto: timestamp-based, always higher than any previous upload
            # (ASC rejects build numbers <= the last uploaded one).
            BUILD_NUMBER="$(date +%Y%m%d%H%M%S)"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Archive (Release, manual signing)
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          # Signing settings (CODE_SIGN_STYLE/IDENTITY/PROFILE_SPECIFIER) live in
          # project.yml Release config, target-scoped, so they don't leak into
          # SPM package targets. PROFILE_NAME env var expands into the specifier.
          xcodebuild archive \
            -project IoniqTelemetry.xcodeproj \
            -scheme IoniqTelemetry \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IoniqTelemetry.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>uploadSymbols</key>
              <false/>
              <key>teamID</key>
              <string>S232V5F699</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fmz.IoniqTelemetry</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/IoniqTelemetry.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          echo "--- export dir contents ---"
          ls -laR "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect (TestFlight)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # Apple ID + app-specific password auth (no API key needed).
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 2 -name '*.ipa' | head -1)"
          test -n "$IPA_PATH" || { echo "ERROR: no .ipa found in $RUNNER_TEMP/export"; exit 1; }
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_SPECIFIC_PASSWORD" \
            --verbose
