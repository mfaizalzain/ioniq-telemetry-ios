name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        # Do NOT xcode-select a specific version: the runner image's simulator
        # runtimes only match its default Xcode, and forcing an older one makes
        # actool fail with "No simulator runtime version ... available".
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare workspace (Secrets.xcconfig + missing test dir)
        # Secrets.xcconfig is gitignored; XcodeGen validates its existence at
        # generate time, so it must exist BEFORE xcodegen runs.
        # IoniqTelemetryTests/ is referenced by project.yml but not committed;
        # create it so generation validates (target stays empty until pushed).
        run: |
          cp Secrets.xcconfig.example Secrets.xcconfig
          if [ -n "${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" ]; then
            echo "OPEN_CHARGE_MAP_API_KEY=${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" >> Secrets.xcconfig
          fi
          cat Secrets.xcconfig
          mkdir -p IoniqTelemetryTests
          ls -la

      - name: Generate project
        run: xcodegen generate

      - name: Run package tests (CoreOBD, CoreDomain)
        run: |
          swift test --package-path Packages/CoreOBD
          swift test --package-path Packages/CoreDomain

      - name: Build app (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project IoniqTelemetry.xcodeproj \
            -scheme IoniqTelemetry \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > /tmp/build.log 2>&1 || {
              echo "===== BUILD FAILED ====="
              grep -nE "error:|warning:" /tmp/build.log | head -80
              echo "===== LAST 30 LINES ====="
              tail -30 /tmp/build.log
              exit 1
            }
          echo "===== BUILD OK (warnings) ====="
          grep -nE "warning:" /tmp/build.log | head -30 || true
          tail -5 /tmp/build.log

      - name: Run app unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project IoniqTelemetry.xcodeproj \
            -scheme IoniqTelemetry \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test > /tmp/test.log 2>&1 || {
              echo "===== TEST FAILED ====="
              grep -nE "error:|failed" /tmp/test.log | head -60
              echo "===== LAST 30 LINES ====="
              tail -30 /tmp/test.log
              exit 1
            }
          echo "===== TESTS OK ====="
          grep -E "Executed|passed" /tmp/test.log | tail -5
