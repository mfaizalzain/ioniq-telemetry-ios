name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Create Secrets.xcconfig
        # The real file is gitignored; CI uses the example. A blank OCM key is
        # fine for compiling — runtime keys come from Settings in the app.
        run: |
          cp Secrets.xcconfig.example Secrets.xcconfig
          if [ -n "${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" ]; then
            echo "OPEN_CHARGE_MAP_API_KEY=${{ secrets.OPEN_CHARGE_MAP_API_KEY }}" >> Secrets.xcconfig
          fi
          cat Secrets.xcconfig

      - name: Run package tests (CoreOBD, CoreDomain)
        run: |
          swift test --package-path Packages/CoreOBD
          swift test --package-path Packages/CoreDomain

      - name: Build app (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project IoniqTelemetry.xcodeproj \
            -scheme IoniqTelemetry \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      - name: Run app unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project IoniqTelemetry.xcodeproj \
            -scheme IoniqTelemetry \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tail -60
